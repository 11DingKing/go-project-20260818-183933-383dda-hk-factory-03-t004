# Example sitesync configuration. Every field can also be set via environment
# variables prefixed with SITESYNC_ (for example SITESYNC_SERVER_PORT).
server:
  port: 48557
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s
storage:
  data_dir: ./data
  db_file: sitesync.db
  max_open_conns: 1
  busy_timeout_ms: 15000
scheduler:
  poll_interval: 8h
  escalator_interval: 1h
  recovery_on_start: true
  max_retries: 5
  base_backoff: 2s
  max_backoff: 2m
  lease_ttl: 10m
trial:
  default_window_hours: 720
  acceptance_window_hours: 336
backfill:
  window_hours: 168
  manual_review_after_hours: 336
log:
  level: info
  development: false
